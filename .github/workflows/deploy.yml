name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          timeout: 60000
          server-dir: /public_html/sahsicari/
          state-name: .ftp-deploy-sync-state-v2.json
          dangerous-clean-slate: false
          exclude: |
            .git/**
            .github/**
            .claude/**
            .vscode/**
            .cursor/**
            **/.git/**
            **/.github/**
            **/.claude/**
            **/.vscode/**
            **/.cursor/**
            node_modules/**
            reports/**
            backups/**
            kd_backups/**
            veriler.json
            .DS_Store
            .cpanel.yml
            DEPLOY-*.md
